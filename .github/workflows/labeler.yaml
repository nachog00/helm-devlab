name: Dynamic Chart Labeler
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'charts/**'

permissions:
  pull-requests: write

jobs:
  label-changed-charts:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get list of changed charts
        id: changed
        run: |
          git fetch origin ${{ github.base_ref }}
          CHANGED_DIRS=$(git diff --name-only origin/${{ github.base_ref }} HEAD | grep '^charts/' | cut -d '/' -f2 | sort -u)
          echo "changed_charts<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_DIRS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Apply labels to PR
        uses: actions/github-script@v7
        with:
          script: |
            const changed = `${{ steps.changed.outputs.changed_charts }}`.split("\n").filter(Boolean)
            const labels = changed.map(name => name.trim())
            if (labels.length > 0) {
              await github.rest.prs.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pr_number: context.pr.number,
                labels: labels,
              })
              console.log(`Added labels: ${labels.join(", ")}`)
            } else {
              console.log("No chart directories changed.")
            }

