name: Helm Chart CI
on:
  pull_request:
    paths:
      - 'charts/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint and template all charts
        run: |
          for dir in charts/*; do
            if [ -f "$dir/Chart.yaml" ]; then
              echo "🔍 Validating $dir"
              helm lint "$dir"
              helm template "$dir"
            fi
          done
