apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: demo-app-previews
  namespace: argocd
spec:
  generators:
    - pullRequest:
        github:
          owner: nachog00
          repo: helm-devlab
          tokenRef:
            secretName: github-token
            key: token
        requeueAfterSeconds: 60
      template:
        metadata:
          name: demo-app-pr-{{number}}
        spec:
          project: default
          source:
            repoURL: https://github.com/nachog00/helm-devlab.git
            targetRevision: '{{head_sha}}'
            path: charts/demo-app
            helm:
              values: |
                namespace: demo-pr-{{number}}
                envSuffix: -pr-{{number}}
          destination:
            server: https://kubernetes.default.svc
            namespace: demo-pr-{{number}}
          syncPolicy:
            automated:
              prune: true
              selfHeal: true

    - git:
        repoURL: https://github.com/nachog00/helm-devlab.git
        revision: dev
        directories:
          - path: charts/demo-app
      template:
        metadata:
          name: demo-app-dev
        spec:
          project: default
          source:
            repoURL: https://github.com/nachog00/helm-devlab.git
            targetRevision: dev
            path: charts/demo-app
            helm:
              values: |
                namespace: demo-dev
                envSuffix: -dev
          destination:
            server: https://kubernetes.default.svc
            namespace: demo-dev
          syncPolicy:
            automated:
              prune: true
              selfHeal: true
